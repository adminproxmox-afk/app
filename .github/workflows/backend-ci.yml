name: FinWay backend checks
on: [push, pull_request, workflow_dispatch, workflow_call]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: coursework-tests-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -pcoursework-tests-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
      - name: PHP and JavaScript syntax
        run: |
          find api scripts -name '*.php' -print0 | xargs -0 -n1 php -l
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Release boundaries and rollback
        run: python3 -m unittest discover -s tests -p test_release.py -v
      - name: Isolated MySQL integration
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_USER: root
          MYSQL_PWD: coursework-tests-only
        run: python3 tests/integration.py
      - name: Build public release
        run: python3 scripts/build_release.py build/finway.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: finway-release
          path: build/finway.tar.gz
