<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>HTML Crash Course</title>
  <script>
    (() => {
      try {
        const rawDb = localStorage.getItem('miniAppDb');
        const db = rawDb ? JSON.parse(rawDb) : null;
        const dark = typeof db?.settings?.darkMode === 'boolean'
          ? db.settings.darkMode
          : localStorage.getItem('darkMode') !== 'false';
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
  <link rel="stylesheet" href="../../../../../../style/app-shell.css">
  <link rel="stylesheet" href="../../../../../../style/ui-preferences.css">
  <link rel="stylesheet" href="style/html-crash-course-wrapper.css?v=20260513-dnd2">
</head>
<body class="game-wrapper-page">
  <div class="page-shell">
    <main class="app phone-frame">
      <div class="screen screen--game-wrapper">
        <div class="toast" id="toast"></div>

        <header class="app-topbar">
          <div class="app-topbar__row game-topbar">
            <div class="game-topbar__side"></div>
            <div class="app-topbar__center">
              <h1 class="app-topbar__title">HTML Crash Course</h1>
            </div>
            <div class="game-topbar__side game-topbar__side--end">
              <button class="game-exit" id="backBtn" type="button" aria-label="Вийти">← <span>Вийти</span></button>
            </div>
          </div>
        </header>

        <section class="course-card">
          <div>
            <p class="course-card__eyebrow">Life Capital Academy</p>
            <h2>Збери HTML. Перевір. Йди далі.</h2>
            <p>10 коротких рівнів з preview, XP і монетами.</p>
          </div>
          <div class="course-stats">
            <span id="levelBadge">Рівень 1 / 10</span>
            <span id="progressBadge">0 / 10 пройдено</span>
            <span id="xpBadge">0 XP</span>
          </div>
        </section>

        <section class="frame-card" id="frameShell">
          <div class="frame-loading" id="frameLoading">Завантажуємо гру...</div>
          <iframe
            id="gameFrame"
            title="HTML Crash Course"
            src="runtime/index.html"
            loading="eager"
            referrerpolicy="same-origin"
          ></iframe>
        </section>

        <nav class="bottom-nav" aria-label="Нижня навігація">
          <button class="bottom-nav__item active" data-nav="home" type="button"><span class="bottom-nav__icon">⌂</span><span>Головна</span></button>
          <button class="bottom-nav__item" data-nav="profile" type="button"><span class="bottom-nav__icon">●</span><span>Аватар</span></button>
          <button class="bottom-nav__item" data-nav="shop" type="button"><span class="bottom-nav__icon">▣</span><span>Магазин</span></button>
          <button class="bottom-nav__item" data-nav="settings" type="button"><span class="bottom-nav__icon">⚙</span><span>Налаштування</span></button>
        </nav>
      </div>
    </main>
  </div>

  <script src="../../../../../../js/db.js"></script>
  <script src="../../../../../../js/ui-preferences.js"></script>
  <script src="js/html-crash-course-wrapper.js?v=20260513-dnd2"></script>
</body>
</html>
